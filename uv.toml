# "torchaudio @ file:///data/src/torchaudio-src/dist/torchaudio-2.11.0+cu128-cp312-cp312-linux_x86_64.whl",
# "torchvision @ file:///data/src/torchvision-src/dist/torchvision-0.28.0+cu128-cp312-cp312-linux_x86_64.whl",
